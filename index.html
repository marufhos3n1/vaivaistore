<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhai Bhai Store - Cloud Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #0f172a; color: #e2e8f0; }
        .dark-card { background: #1e293b; border: 1px solid #334155; }
        .low-stock { color: #f87171 !important; font-weight: bold; animation: pulse 2s infinite; background: rgba(248, 113, 113, 0.05); }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .admin-only { display: none !important; }
        .is-admin .admin-only { display: flex !important; }
        .is-admin .admin-block { display: block !important; }
        .dropdown-content {
            display: none; position: absolute; width: 100%; max-height: 250px; overflow-y: auto;
            background-color: #1e293b; border: 1px solid #334155; border-radius: 0.75rem;
            z-index: 100; margin-top: 5px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }
        .dropdown-content div { padding: 12px; cursor: pointer; border-bottom: 1px solid #334155; }
        .dropdown-content div:hover { background-color: #334155; color: #818cf8; }
        .show { display: block; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-40 shadow-lg">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl md:text-2xl font-bold text-indigo-400 cursor-pointer" onclick="showSection('inventory')">
                <i class="fas fa-store"></i> ভাই ভাই স্টোর
            </h1>
            
            <div class="flex items-center gap-3">
                <div id="authButtons">
                    <button onclick="openLoginModal()" class="bg-indigo-600 hover:bg-indigo-700 px-4 py-2 rounded-lg text-sm font-bold transition">Login</button>
                </div>
                <div id="userProfile" class="hidden flex items-center gap-3">
                    <span id="displayUser" class="text-xs font-semibold text-green-400 hidden md:block italic"></span>
                    <button onclick="toggleMenu()" class="text-2xl focus:outline-none hover:text-indigo-400 transition"><i class="fas fa-bars"></i></button>
                    <div id="hamburgerMenu" class="hidden absolute right-4 mt-12 w-52 bg-slate-800 border border-slate-700 rounded-xl shadow-2xl overflow-hidden z-50">
                        <button onclick="showSection('inventory')" class="w-full text-left px-4 py-3 hover:bg-slate-700 border-b border-slate-700 font-semibold"><i class="fas fa-boxes mr-2"></i> ইনভেন্টরি</button>
                        <button onclick="showSection('billing')" class="w-full text-left px-4 py-3 hover:bg-slate-700 border-b border-slate-700 font-semibold"><i class="fas fa-calculator mr-2"></i> বিলিং (POS)</button>
                        <button onclick="handleLogout()" class="w-full text-left px-4 py-3 hover:bg-red-900/50 text-red-400 font-bold"><i class="fas fa-sign-out-alt mr-2"></i> লগআউট</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">
        <section id="inventorySection" class="space-y-6">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <h2 class="text-2xl font-bold flex items-center gap-2 text-indigo-100">
                    <i class="fas fa-clipboard-check text-indigo-500"></i> স্টক ম্যানেজমেন্ট
                </h2>
                <div class="relative w-full md:w-80">
                    <i class="fas fa-search absolute left-3 top-3.5 text-slate-500"></i>
                    <input type="text" id="inventorySearch" onkeyup="renderProducts()" placeholder="পণ্যের নাম দিয়ে খুঁজুন..." class="w-full p-3 pl-10 rounded-xl bg-slate-800 border border-slate-700 outline-none focus:border-indigo-500 transition shadow-lg">
                </div>
            </div>
            <div class="overflow-x-auto rounded-2xl border border-slate-700 shadow-2xl">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-800 text-slate-300 font-semibold uppercase text-xs">
                        <tr>
                            <th class="p-4">পণ্যের নাম</th>
                            <th class="p-4 text-center">মূল্য/ইউনিট</th>
                            <th class="p-4 text-center">বর্তমান স্টক</th>
                            <th class="p-4 text-right admin-only">অ্যাকশন</th>
                        </tr>
                    </thead>
                    <tbody id="productTableBody" class="divide-y divide-slate-800 bg-slate-900/50"></tbody>
                </table>
            </div>
        </section>

        <section id="billingSection" class="hidden space-y-6">
            <h2 class="text-2xl font-bold text-indigo-400 flex items-center gap-2"><i class="fas fa-calculator"></i> স্মার্ট বিলিং (POS)</h2>
            <div class="grid lg:grid-cols-3 gap-6">
                <div class="lg:col-span-1">
                    <div class="dark-card p-6 rounded-2xl shadow-xl relative h-fit">
                        <label class="block mb-3 font-semibold text-slate-400 italic">পণ্য সিলেক্ট করুন</label>
                        <div class="relative">
                            <input type="text" id="pInput" onfocus="toggleDropdown()" onkeyup="filterDropdown()" placeholder="সার্চ করুন..." autocomplete="off" class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700 outline-none focus:border-indigo-500 transition font-bold">
                            <div id="pDropdown" class="dropdown-content"></div>
                        </div>
                    </div>
                </div>
                <div class="lg:col-span-2">
                    <div class="dark-card p-6 rounded-2xl border-t-4 border-indigo-500 shadow-xl">
                        <div id="cartList" class="min-h-[200px] space-y-3 mb-6"></div>
                        <div class="grid md:grid-cols-2 gap-6 border-t border-slate-700 pt-6">
                            <div class="space-y-4">
                                <input type="text" id="custName" placeholder="কাস্টমারের নাম" class="w-full p-3 rounded-xl bg-slate-800 border border-slate-700 outline-none">
                                <div class="flex gap-3">
                                    <input type="number" id="custPaid" onkeyup="calcDue()" placeholder="জমা (৳)" class="w-1/2 p-3 rounded-xl bg-slate-800 border border-green-900 text-green-400 outline-none font-bold">
                                    <input type="number" id="custDue" placeholder="বাকি (৳)" readonly class="w-1/2 p-3 rounded-xl bg-slate-800 border border-red-900 text-red-500 outline-none font-bold">
                                </div>
                            </div>
                            <div class="bg-slate-800/50 p-4 rounded-xl text-right flex flex-col justify-center border border-slate-700">
                                <span class="text-slate-400 text-sm italic">সর্বমোট বিল</span>
                                <h3 class="text-3xl font-black text-indigo-400" id="grandTotalDisplay">৳০.০০</h3>
                            </div>
                        </div>
                        <button onclick="processCheckout()" class="w-full mt-6 bg-green-600 hover:bg-green-700 p-4 rounded-xl font-bold text-lg transition flex items-center justify-center gap-3">
                            <i class="fab fa-whatsapp text-2xl"></i> রিসিপ্ট ও স্টক আপডেট
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <button onclick="openProductModal()" id="floatingAddBtn" class="admin-only fixed bottom-8 right-8 w-16 h-16 bg-green-600 text-white rounded-full shadow-2xl flex items-center justify-center text-3xl z-50 hover:bg-green-500 transition">
        <i class="fas fa-plus"></i>
    </button>

    <div id="loginModal" class="fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 p-8 rounded-3xl w-full max-w-sm border border-slate-700 relative">
            <button onclick="closeLoginModal()" class="absolute top-4 right-4 text-slate-500 hover:text-white"><i class="fas fa-times"></i></button>
            <h3 class="text-2xl font-bold text-center mb-6">অ্যাডমিন লগইন</h3>
            <div class="space-y-4">
                <input type="email" id="loginEmail" placeholder="ইমেইল" class="w-full p-3 rounded-xl bg-slate-900 border border-slate-700 outline-none">
                <input type="password" id="loginPass" placeholder="পাসওয়ার্ড" class="w-full p-3 rounded-xl bg-slate-900 border border-slate-700 outline-none">
                <button id="loginBtn" onclick="handleLogin()" class="w-full bg-indigo-600 hover:bg-indigo-700 p-3 rounded-xl font-bold transition">প্রবেশ করুন</button>
            </div>
        </div>
    </div>

    <div id="productModal" class="fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 p-6 rounded-2xl w-full max-w-md border border-slate-700">
            <h3 id="modalTitle" class="text-xl font-bold mb-6 text-indigo-400">পণ্য ম্যানেজমেন্ট</h3>
            <input type="hidden" id="editId">
            <div class="space-y-4">
                <input type="text" id="pName" placeholder="পণ্যের নাম" class="w-full p-3 rounded-xl bg-slate-900 border border-slate-700 outline-none">
                <div class="flex gap-3">
                    <input type="number" id="pPrice" placeholder="মূল্য (৳)" class="w-1/2 p-3 rounded-xl bg-slate-900 border border-slate-700 outline-none">
                    <select id="pUnit" class="w-1/2 p-3 rounded-xl bg-slate-900 border border-slate-700 outline-none font-bold">
                        <option value="কেজি">কেজি</option>
                        <option value="পিস">পিস</option>
                        <option value="হালি">হালি</option>
                        <option value="লিটার">লিটার</option>
                    </select>
                </div>
                <input type="number" id="pStock" placeholder="স্টক পরিমাণ" class="w-full p-3 rounded-xl bg-slate-900 border border-slate-700 outline-none">
                <div class="flex gap-3 pt-4">
                    <button onclick="saveProduct()" class="flex-1 bg-indigo-600 p-3 rounded-xl font-bold hover:bg-indigo-700 transition">সেভ করুন</button>
                    <button onclick="closeProductModal()" class="flex-1 bg-slate-700 p-3 rounded-xl font-bold hover:bg-slate-600 transition">বাতিল</button>
                </div>
            </div>
        </div>
    </div>

    <div id="qtyModal" class="fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-slate-800 p-6 rounded-2xl w-full max-w-xs border border-indigo-500">
            <h3 id="qtyProdName" class="text-lg font-bold text-center text-indigo-300">পরিমাণ নির্ধারণ</h3>
            <p id="availableStockLabel" class="text-xs text-center text-red-400 mb-4 italic"></p>
            <input type="hidden" id="qtyProdId">
            <div class="space-y-4">
                <div class="flex gap-2">
                    <input type="number" id="buyQty" value="1" step="any" class="w-2/3 p-3 rounded-xl bg-slate-900 border border-slate-700 outline-none text-center text-xl font-bold">
                    <select id="buyUnit" class="w-1/3 p-2 rounded-xl bg-slate-900 border border-slate-700 outline-none text-indigo-400 font-bold"></select>
                </div>
                <button onclick="confirmAddToCart()" class="w-full bg-indigo-600 p-3 rounded-xl font-bold text-lg hover:bg-indigo-700 transition">কার্টে যোগ করুন</button>
                <button onclick="closeQtyModal()" class="w-full text-slate-500 text-sm">বাতিল</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, onSnapshot, enableIndexedDbPersistence } 
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } 
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyD7psyUNSU6hEmqp3DiKc7Bg7vF94Qp_D8",
            authDomain: "bhaibhaistore-17848.firebaseapp.com",
            projectId: "bhaibhaistore-17848",
            storageBucket: "bhaibhaistore-17848.firebasestorage.app",
            messagingSenderId: "540362597216",
            appId: "1:540362597216:web:259b79b9fda4892ab8f405"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const productsCol = collection(db, "products");

        // অফলাইন সাপোর্ট এনাবল করা
        enableIndexedDbPersistence(db).catch((err) => console.error("Offline persistence failed", err));

        let products = [];
        let cart = [];

        // --- AUTH ---
        window.handleLogin = async () => {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            const btn = document.getElementById('loginBtn');
            btn.innerText = "লোডিং...";
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                closeLoginModal();
            } catch (error) {
                alert("ভুল ইমেইল বা পাসওয়ার্ড!");
            } finally { btn.innerText = "প্রবেশ করুন"; }
        };

        window.handleLogout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if (user && user.email === 'marufhos3n@gmail.com') {
                document.body.classList.add('is-admin');
                document.getElementById('authButtons').classList.add('hidden');
                document.getElementById('userProfile').classList.remove('hidden');
                document.getElementById('displayUser').innerText = "অ্যাডমিন: " + user.email.split('@')[0];
            } else {
                document.body.classList.remove('is-admin');
                document.getElementById('authButtons').classList.remove('hidden');
                document.getElementById('userProfile').classList.add('hidden');
                showSection('inventory');
            }
        });

        // --- DATA SYNC ---
        onSnapshot(productsCol, (snapshot) => {
            products = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderProducts();
            updateDropdownList();
        });

        window.renderProducts = () => {
            const tbody = document.getElementById('productTableBody');
            const query = document.getElementById('inventorySearch').value.toLowerCase();
            tbody.innerHTML = '';
            const filtered = products.filter(p => p.name.toLowerCase().includes(query));
            filtered.forEach(p => {
                const isLow = p.stock <= 5;
                tbody.innerHTML += `
                    <tr class="${isLow ? 'low-stock' : ''} border-b border-slate-800">
                        <td class="p-4 font-semibold">${p.name}</td>
                        <td class="p-4 text-center font-bold">৳${p.price} / ${p.unit}</td>
                        <td class="p-4 text-center font-bold">${p.stock} ${p.unit}</td>
                        <td class="p-4 text-right admin-only">
                            <div class="flex justify-end gap-3">
                                <button onclick="openProductModal('${p.id}')" class="text-indigo-400"><i class="fas fa-edit"></i></button>
                                <button onclick="deleteProduct('${p.id}')" class="text-red-500"><i class="fas fa-trash-alt"></i></button>
                            </div>
                        </td>
                    </tr>`;
            });
        };

        window.saveProduct = async () => {
            const id = document.getElementById('editId').value;
            const pData = {
                name: document.getElementById('pName').value,
                price: parseFloat(document.getElementById('pPrice').value),
                unit: document.getElementById('pUnit').value,
                stock: parseFloat(document.getElementById('pStock').value)
            };
            if (!pData.name || isNaN(pData.price)) return alert("সঠিক তথ্য দিন!");
            try {
                id ? await updateDoc(doc(db, "products", id), pData) : await addDoc(productsCol, pData);
                closeProductModal();
            } catch (e) { alert("Error saving data"); }
        };

        window.deleteProduct = async (id) => {
            if (confirm('পণ্যটি মুছে ফেলতে চান?')) await deleteDoc(doc(db, "products", id));
        };

        // --- POS FUNCTIONS ---
        window.confirmAddToCart = () => {
            const id = document.getElementById('qtyProdId').value;
            const p = products.find(prod => prod.id === id);
            const qty = parseFloat(document.getElementById('buyQty').value);
            const unit = document.getElementById('buyUnit').value;
            let req = unit === 'গ্রাম' ? qty / 1000 : qty;
            if (req > p.stock) return alert("স্টক আউট!");
            let price = unit === 'গ্রাম' ? (p.price / 1000) * qty : p.price * qty;
            cart.push({ id: p.id, name: p.name, buyQty: qty, buyUnit: unit, qtyInMainUnit: req, finalPrice: price });
            renderCart(); closeQtyModal();
        };

        window.processCheckout = async () => {
            if (cart.length === 0) return alert("কার্ট খালি!");
            for (const item of cart) {
                const p = products.find(prod => prod.id === item.id);
                if (p) {
                    const newStock = parseFloat((p.stock - item.qtyInMainUnit).toFixed(3));
                    await updateDoc(doc(db, "products", p.id), { stock: newStock });
                }
            }
            sendToWhatsApp(cart);
            cart = []; renderCart();
        };

        // UI Helpers
        window.openLoginModal = () => document.getElementById('loginModal').classList.remove('hidden');
        window.closeLoginModal = () => document.getElementById('loginModal').classList.add('hidden');
        window.openProductModal = (id = null) => {
            document.getElementById('productModal').classList.remove('hidden');
            if (id) {
                const p = products.find(prod => prod.id === id);
                document.getElementById('editId').value = p.id;
                document.getElementById('pName').value = p.name;
                document.getElementById('pPrice').value = p.price;
                document.getElementById('pUnit').value = p.unit;
                document.getElementById('pStock').value = p.stock;
            } else {
                document.getElementById('editId').value = '';
                document.getElementById('pName').value = ''; document.getElementById('pPrice').value = ''; document.getElementById('pStock').value = '';
            }
        };
        window.closeProductModal = () => document.getElementById('productModal').classList.add('hidden');
        window.showSection = (s) => {
            document.getElementById('inventorySection').classList.add('hidden');
            document.getElementById('billingSection').classList.add('hidden');
            document.getElementById(s + 'Section').classList.remove('hidden');
        };
        window.toggleMenu = () => document.getElementById('hamburgerMenu').classList.toggle('hidden');
        window.toggleDropdown = () => document.getElementById("pDropdown").classList.add("show");
        window.filterDropdown = () => {
            const input = document.getElementById("pInput").value.toLowerCase();
            updateDropdownList(input);
        };
        window.updateDropdownList = (filter = "") => {
            const dropdown = document.getElementById("pDropdown");
            dropdown.innerHTML = "";
            products.filter(p => p.name.toLowerCase().includes(filter) && p.stock > 0).forEach(p => {
                const item = document.createElement("div");
                item.innerHTML = `<span>${p.name}</span><span class="text-xs float-right text-indigo-400">স্টক: ${p.stock}</span>`;
                item.onclick = () => { document.getElementById("pDropdown").classList.remove("show"); document.getElementById("pInput").value = ""; openQtyModal(p.id); };
                dropdown.appendChild(item);
            });
        };
        window.openQtyModal = (id) => {
            const p = products.find(prod => prod.id === id);
            document.getElementById('qtyProdId').value = id;
            document.getElementById('qtyProdName').innerText = p.name;
            document.getElementById('availableStockLabel').innerText = `মজুদ: ${p.stock} ${p.unit}`;
            const unitSelect = document.getElementById('buyUnit');
            unitSelect.innerHTML = `<option value="${p.unit}">${p.unit}</option>`;
            if (p.unit === 'কেজি') unitSelect.innerHTML += `<option value="গ্রাম">গ্রাম</option>`;
            document.getElementById('qtyModal').classList.remove('hidden');
        };
        window.closeQtyModal = () => document.getElementById('qtyModal').classList.add('hidden');

        function renderCart() {
            const cartDiv = document.getElementById('cartList');
            cartDiv.innerHTML = ''; let total = 0;
            cart.forEach((item, idx) => {
                total += item.finalPrice;
                cartDiv.innerHTML += `<div class="flex justify-between items-center bg-slate-800/60 p-4 rounded-xl border border-slate-700">
                    <div><span class="font-bold">${item.name}</span><br><span class="text-xs text-slate-500">${item.buyQty} ${item.buyUnit}</span></div>
                    <span class="font-bold text-indigo-400">৳${item.finalPrice.toFixed(2)}</span>
                </div>`;
            });
            document.getElementById('grandTotalDisplay').innerText = `৳${total.toFixed(2)}`;
            calcDue();
        }

        window.calcDue = () => {
            const total = parseFloat(document.getElementById('grandTotalDisplay').innerText.replace('৳', '')) || 0;
            const paid = parseFloat(document.getElementById('custPaid').value) || 0;
            document.getElementById('custDue').value = (total - paid).toFixed(2);
        };

        function sendToWhatsApp(currentCart) {
            const name = document.getElementById('custName').value || "গ্রাহক";
            const total = document.getElementById('grandTotalDisplay').innerText.replace('৳', '');
            const paid = document.getElementById('custPaid').value || 0;
            const due = document.getElementById('custDue').value || 0;
            const dateStr = new Date().toLocaleDateString('bn-BD', { day: 'numeric', month: 'long', year: 'numeric' });
            let itemsStr = currentCart.map((i, idx) => `${idx + 1}. ${i.name} (${i.buyQty} ${i.buyUnit}): ${i.finalPrice.toFixed(2)}৳`).join('%0A');
            const msg = `*ভাই ভাই স্টোর*%0Aতারিখ: ${dateStr}%0Aনাম: ${name}%0A───────────────%0A*পণ্য তালিকা:*%0A${itemsStr}%0A───────────────%0A*মোট বিল:* ${total}৳%0A*জমা:* ${paid}৳%0A*বাকি:* ${due}৳%0A───────────────%0Aধন্যবাদ!%0Aআবার আসবেন।`;
            window.open(`https://wa.me/?text=${msg}`, '_blank');
        }
    </script>
</body>
</html>
